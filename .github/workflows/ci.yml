name: Validate portfolio
on:
  push:
    branches: [main, portfolio-v2]
  pull_request:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/generate_demo_data.py
      - run: python -m src.data_loader
      - run: python -m src.reporting
      - run: python check.py
      - run: python -m pytest -q
      - run: python -m jupyter nbconvert --to notebook --execute notebooks/amazon_sales_analysis.ipynb --output /tmp/portfolio-executed.ipynb --ExecutePreprocessor.timeout=120
      - uses: actions/upload-artifact@v4
        with:
          name: validated-analysis
          path: |
            reports/
            bi/exports/
